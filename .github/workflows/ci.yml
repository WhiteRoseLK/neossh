name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

  test:
    name: Unit Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: ignore

  build:
    name: Compilation & GoReleaser Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -v ./cmd/main.go

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v5
        with:
          version: 2.9.0
          args: check

      - name: Validate Release Distribution Targets (Release PRs only)
        if: startsWith(github.head_ref, 'release-please')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/verify-release-targets.py

      - name: Dry-run Packaging & Manifests (Release PRs only)
        if: startsWith(github.head_ref, 'release-please')
        uses: goreleaser/goreleaser-action@v5
        with:
          version: 2.9.0
          args: release --snapshot --clean --skip=publish

