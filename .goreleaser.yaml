version: 2
project_name: neossh

before:
  hooks:
    - go mod tidy

builds:
  - goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
      - 386
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: 386
    main: ./cmd/main.go
    ldflags:
      -X main.version={{.Version}} -X main.gitCommit={{.Commit}}



archives:
  - formats: [ tar.gz ]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
        {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [ zip ]

brews:
  - repository:
      owner: WhiteRoseLK
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/WhiteRoseLK/neossh"
    description: "An actively maintained fork and continuation of lazyssh"
    license: "Apache-2.0"
    install: |-
      bin.install "neossh"
    test: |-
      assert_match version.to_s, shell_output("#{bin}/neossh --version")
    custom_block: |-
      conflicts_with "lazyssh", because: "neossh is an actively maintained fork of lazyssh"
    caveats: |-
      If you previously used lazyssh, neossh automatically migrates your
      metadata and settings from ~/.lazyssh to ~/.neossh. Your SSH config is unchanged.

scoops:
  - repository:
      owner: WhiteRoseLK
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/WhiteRoseLK/neossh"
    description: "An actively maintained fork and continuation of lazyssh"
    license: "Apache-2.0"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  mode: keep-existing
  replace_existing_artifacts: true
  footer: |
    {{- if .PreviousTag }}

    **Full Changelog**: https://github.com/WhiteRoseLK/neossh/compare/{{ .PreviousTag }}...{{ .Tag }}
    {{- end }}

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
