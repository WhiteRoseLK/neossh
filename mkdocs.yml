site_name: neossh
site_description: >-
  An interactive, keyboard-driven SSH manager for your terminal.
  Manage, connect, and configure servers from ~/.ssh/config with ease.
site_author: WhiteRoseLK
repo_name: WhiteRoseLK/neossh
repo_url: https://github.com/WhiteRoseLK/neossh
edit_uri: edit/main/docs/

copyright: >-
  Copyright &copy; 2024–2026 WhiteRoseLK &amp; contributors —
  Fork of <a href="https://github.com/Adembc/lazyssh">lazyssh</a> by Adembc

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WhiteRoseLK/neossh
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Guide:
      - Server Management: guide/server-management.md
      - Search & Navigation: guide/search-navigation.md
      - SSH Configuration: guide/ssh-configuration.md
      - Key Management: guide/key-management.md
      - SFTP & File Transfer: guide/sftp-file-transfer.md
      - Port Forwarding & Tunnels: guide/port-forwarding.md
      - SSHFS Remote Mounts: guide/sshfs.md
      - Backup & Export: guide/backup-export.md
      - Pre-Connect Hooks: guide/pre-connect-hooks.md
      - Password Authentication: guide/password-auth.md
      - Certificates: guide/certificates.md
      - Tags & Config Comments: guide/tags.md
      - Internationalization: guide/i18n.md
  - Reference:
      - CLI Flags & Options: reference/cli.md
      - Keybindings: reference/keybindings.md
      - Configuration Files: reference/configuration.md
      - Shell Completion: reference/shell-completion.md
  - Security: security.md
  - Changelog: changelog.md
  - Contributing: contributing.md
